<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Yep Anywhere - Remote</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <style>
      /* Critical CSS to prevent flash of white background - only html, body/root handled by main CSS */
      html { background-color: #181818; }
      html[data-theme="light"] { background-color: #faf9f5; }
      html[data-theme="dark"] { background-color: #2f2f2f; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) { background-color: #faf9f5; }
      }
    </style>
    <script>
      // Apply theme before page renders to prevent flash
      (() => {
        var stored = localStorage.getItem('yep-anywhere-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'verydark');
        document.documentElement.setAttribute('data-theme', theme);
      })();

      // In Tauri: intercept window.open and external links to open in default browser
      (() => {
        // Wait for Tauri to be available, then patch window.open
        const setupTauriLinks = () => {
          if (!window.__TAURI__ || !window.__TAURI__.opener) {
            // Tauri not ready yet, retry
            setTimeout(setupTauriLinks, 100);
            return;
          }
          const openUrl = window.__TAURI__.opener.openUrl;
          if (!openUrl) return;

          // Override window.open to open external URLs in default browser
          const origOpen = window.open.bind(window);
          window.open = (url, target, features) => {
            if (url && typeof url === 'string' && !url.startsWith(window.location.origin) && !url.startsWith('#') && !url.startsWith('data:')) {
              openUrl(url).catch((err) => console.warn('[Tauri] openUrl failed:', err));
              return null;
            }
            return origOpen(url, target, features);
          };

          // Also intercept <a> clicks for links with target="_blank"
          document.addEventListener('click', (e) => {
            const a = e.target.closest('a[href]');
            if (!a) return;
            const href = a.href;
            if (!href || href.startsWith('javascript:') || href.startsWith('#') || href.startsWith('data:')) return;
            if (href.startsWith(window.location.origin)) return;
            e.preventDefault();
            openUrl(href).catch((err) => console.warn('[Tauri] openUrl failed:', err));
          }, true);

          console.log('[Tauri] External link handler installed');
        };
        setupTauriLinks();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remote-main.tsx"></script>
  </body>
</html>
